name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'
  RUN_API_INTEGRATION_TESTS: 'false'
  # MinIO Configuration for image storage
  # Ensure MinIO is configured in deployment environments
  # For Azure: Consider using Azure Blob Storage as alternative
  # For local/dev: Use docker-compose with MinIO service

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-artifact: publish
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Restore dependencies
      run: dotnet restore FunnyActivities.sln
    - name: Build
      run: dotnet build FunnyActivities.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
    - name: Publish
      run: dotnet publish FunnyActivities.WebAPI/FunnyActivities.WebAPI.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --output ./publish --no-build
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: publish-artifact
        path: ./publish

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Restore dependencies
      run: dotnet restore FunnyActivities.sln
    - name: Run domain unit tests
      run: dotnet test tests/unit/dotnet/FunnyActivities.Domain.UnitTests/FunnyActivities.Domain.UnitTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults
    - name: Run application unit tests
      run: dotnet test tests/unit/dotnet/FunnyActivities.Application.UnitTests/FunnyActivities.Application.UnitTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults
    - name: Run infrastructure integration tests
      run: dotnet test tests/integration/dotnet/FunnyActivities.IntegrationTests/FunnyActivities.IntegrationTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults
    - name: Run API integration tests
      if: ${{ env.RUN_API_INTEGRATION_TESTS == 'true' }}
      continue-on-error: true
      run: dotnet test tests/integration/dotnet/FunnyActivities.Api.IntegrationTests/FunnyActivities.Api.IntegrationTests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: ./TestResults/**/*.xml

  sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Download coverage reports
      uses: actions/download-artifact@v4
      with:
        name: coverage-reports
        path: ./TestResults
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: SonarCloud Scan
      continue-on-error: true
      uses: SonarSource/sonarcloud-github-action@v2
      with:
        args: >
          -Dsonar.organization=your-org
          -Dsonar.projectKey=your-project-key
          -Dsonar.sources=.
          -Dsonar.exclusions=**/bin/**,**/obj/**,**/TestResults/**,**/publish/**
          -Dsonar.cs.coverage.reportsPaths=./TestResults/**/*.cobertura.xml
          -Dsonar.test.inclusions=**/*Tests*/**/*.cs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: dev
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - name: Check Azure Dev secrets
      id: gate-dev
      shell: bash
      run: |
        if [ -z "${{ secrets.AZURE_PUBLISH_PROFILE_DEV }}" ]; then
          echo "run=false" >> $GITHUB_OUTPUT
          echo "AZURE_PUBLISH_PROFILE_DEV not set, skipping Azure Dev deploy."
        else
          echo "run=true" >> $GITHUB_OUTPUT
        fi
    - name: Download build artifacts
      if: steps.gate-dev.outputs.run == 'true'
      uses: actions/download-artifact@v4
      with:
        name: publish-artifact
        path: ./publish
    - name: Deploy to Azure App Service (Dev)
      if: steps.gate-dev.outputs.run == 'true'
      uses: azure/webapps-deploy@v3
      with:
        app-name: funnyactivities-dev
        slot-name: production
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_DEV }}
        package: ./publish

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: staging
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - name: Check Azure Staging secrets
      id: gate-staging
      shell: bash
      run: |
        if [ -z "${{ secrets.AZURE_PUBLISH_PROFILE_STAGING }}" ]; then
          echo "run=false" >> $GITHUB_OUTPUT
          echo "AZURE_PUBLISH_PROFILE_STAGING not set, skipping Azure Staging deploy."
        else
          echo "run=true" >> $GITHUB_OUTPUT
        fi
    - name: Download build artifacts
      if: steps.gate-staging.outputs.run == 'true'
      uses: actions/download-artifact@v4
      with:
        name: publish-artifact
        path: ./publish
    - name: Deploy to Azure App Service (Staging)
      if: steps.gate-staging.outputs.run == 'true'
      uses: azure/webapps-deploy@v3
      with:
        app-name: funnyactivities-staging
        slot-name: production
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_STAGING }}
        package: ./publish

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build, test]
    environment:
      name: prod
      url: https://funnyactivities-prod.azurewebsites.net
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - name: Check Azure Prod secrets
      id: gate-prod
      shell: bash
      run: |
        if [ -z "${{ secrets.AZURE_PUBLISH_PROFILE_PROD }}" ]; then
          echo "run=false" >> $GITHUB_OUTPUT
          echo "AZURE_PUBLISH_PROFILE_PROD not set, skipping Azure Prod deploy."
        else
          echo "run=true" >> $GITHUB_OUTPUT
        fi
    - name: Download build artifacts
      if: steps.gate-prod.outputs.run == 'true'
      uses: actions/download-artifact@v4
      with:
        name: publish-artifact
        path: ./publish
    - name: Deploy to Azure App Service (Prod)
      if: steps.gate-prod.outputs.run == 'true'
      uses: azure/webapps-deploy@v3
      with:
        app-name: funnyactivities-prod
        slot-name: production
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PROD }}
        package: ./publish

  deploy-vps:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - name: Check VPS secrets
      id: gate-vps
      shell: bash
      run: |
        if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ]; then
          echo "run=false" >> $GITHUB_OUTPUT
          echo "VPS_HOST or VPS_USER not set, skipping VPS deploy."
        else
          echo "run=true" >> $GITHUB_OUTPUT
        fi
    - name: Download build artifacts
      if: steps.gate-vps.outputs.run == 'true'
      uses: actions/download-artifact@v4
      with:
        name: publish-artifact
        path: ./publish

    - name: Create package
      if: steps.gate-vps.outputs.run == 'true'
      run: tar czf publish.tar.gz -C publish .

    - name: Prepare SSH credentials
      id: sshcred
      shell: bash
      if: steps.gate-vps.outputs.run == 'true'
      run: |
        if [ -n "${{ secrets.VPS_PASSWORD }}" ]; then
          echo "method=password" >> $GITHUB_OUTPUT
        elif [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
          echo "${{ secrets.VPS_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          echo "method=key" >> $GITHUB_OUTPUT
        else
          echo "No VPS_SSH_KEY or VPS_PASSWORD provided." >&2
          exit 1
        fi

    - name: Upload package (key auth)
      if: steps.sshcred.outputs.method == 'key'
      run: |
        scp -o StrictHostKeyChecking=accept-new -i key.pem publish.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/publish.tar.gz
    - name: Upload package (password auth)
      if: steps.sshcred.outputs.method == 'password'
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        sshpass -p "${{ secrets.VPS_PASSWORD }}" scp -o StrictHostKeyChecking=accept-new publish.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/publish.tar.gz

    - name: Deploy on VPS (key auth)
      if: steps.sshcred.outputs.method == 'key'
      run: |
        ssh -o StrictHostKeyChecking=accept-new -i key.pem ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
          "rm -rf /var/www/funnyactivities/publish && mkdir -p /var/www/funnyactivities/publish && tar xzf /tmp/publish.tar.gz -C /var/www/funnyactivities/publish && if [ -f /etc/funnyactivities/appsettings.Production.json ]; then cp /etc/funnyactivities/appsettings.Production.json /var/www/funnyactivities/publish/; fi && systemctl restart funnyactivities"

    - name: Deploy on VPS (password auth)
      if: steps.sshcred.outputs.method == 'password'
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
          "rm -rf /var/www/funnyactivities/publish && mkdir -p /var/www/funnyactivities/publish && tar xzf /tmp/publish.tar.gz -C /var/www/funnyactivities/publish && if [ -f /etc/funnyactivities/appsettings.Production.json ]; then cp /etc/funnyactivities/appsettings.Production.json /var/www/funnyactivities/publish/; fi && systemctl restart funnyactivities"

  deploy-frontend-vps:
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - name: Check VPS secrets
      id: gate-frontend
      shell: bash
      run: |
        if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ]; then
          echo "run=false" >> $GITHUB_OUTPUT
          echo "VPS_HOST or VPS_USER not set, skipping frontend VPS deploy."
        else
          echo "run=true" >> $GITHUB_OUTPUT
        fi

    - uses: actions/checkout@v4
      if: steps.gate-frontend.outputs.run == 'true'

    - name: Setup Node
      if: steps.gate-frontend.outputs.run == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install frontend dependencies
      if: steps.gate-frontend.outputs.run == 'true'
      run: npm ci
      working-directory: client

    - name: Build frontend
      if: steps.gate-frontend.outputs.run == 'true'
      run: CI=false npm run build
      working-directory: client

    - name: Create frontend package
      if: steps.gate-frontend.outputs.run == 'true'
      run: tar czf frontend.tar.gz -C client/build .

    - name: Prepare SSH credentials
      id: sshcred-frontend
      shell: bash
      if: steps.gate-frontend.outputs.run == 'true'
      run: |
        if [ -n "${{ secrets.VPS_PASSWORD }}" ]; then
          echo "method=password" >> $GITHUB_OUTPUT
        elif [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
          echo "${{ secrets.VPS_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          echo "method=key" >> $GITHUB_OUTPUT
        else
          echo "No VPS_SSH_KEY or VPS_PASSWORD provided." >&2
          exit 1
        fi

    - name: Upload frontend package (key auth)
      if: steps.sshcred-frontend.outputs.method == 'key'
      run: |
        scp -o StrictHostKeyChecking=accept-new -i key.pem frontend.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/frontend.tar.gz

    - name: Upload frontend package (password auth)
      if: steps.sshcred-frontend.outputs.method == 'password'
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        sshpass -p "${{ secrets.VPS_PASSWORD }}" scp -o StrictHostKeyChecking=accept-new frontend.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/frontend.tar.gz

    - name: Deploy frontend on VPS (key auth)
      if: steps.sshcred-frontend.outputs.method == 'key'
      run: |
        ssh -o StrictHostKeyChecking=accept-new -i key.pem ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
          "rm -rf /var/www/funnyactivities/frontend && mkdir -p /var/www/funnyactivities/frontend && tar xzf /tmp/frontend.tar.gz -C /var/www/funnyactivities/frontend && chown -R www-data:www-data /var/www/funnyactivities/frontend"

    - name: Deploy frontend on VPS (password auth)
      if: steps.sshcred-frontend.outputs.method == 'password'
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
          "rm -rf /var/www/funnyactivities/frontend && mkdir -p /var/www/funnyactivities/frontend && tar xzf /tmp/frontend.tar.gz -C /var/www/funnyactivities/frontend && chown -R www-data:www-data /var/www/funnyactivities/frontend"

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-prod]
    if: ${{ failure() }}
    steps:
    - name: Send Slack notification
      uses: slackapi/slack-github-action@v1.26.0
      if: ${{ env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != '' }}
      with:
        channel-id: ${{ env.SLACK_CHANNEL_ID }}
        slack-message: "CI/CD Pipeline failed: ${{ github.workflow }} - ${{ github.run_id }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
