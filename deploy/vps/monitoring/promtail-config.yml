server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://172.30.0.10:3100/loki/api/v1/push

scrape_configs:
  - job_name: funnyactivities-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: funnyactivities-api
          app: funnyactivities-api
          __path__: /var/log/funnyactivities/*.txt
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} [+\-]\d{2}:\d{2}) \[(?P<level>[A-Z]{3})\] (?P<message>.*)$'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05.000 -07:00"
